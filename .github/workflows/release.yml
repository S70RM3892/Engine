name: Release

# シミュレータとゲームの 2 つの APK をビルドして GitHub Release に公開する。
# 起動: v* タグの push / リリースノートかこのワークフローを変更した push / 手動実行。
# タグ名は app/build.gradle.kts の versionName から決める (v<versionName>)。タグが無ければリリース作成時に作る。
# 署名: リポジトリ Secrets (SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS /
# SIGNING_KEY_PASSWORD) があればその鍵、無ければ Gradle のデバッグ鍵。
on:
  push:
    tags: ["v*"]
    branches: [main, "claude/**"]
    paths: ["docs/RELEASE_NOTES.md", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # 既定の "tools" パッケージは廃止済みで sdkmanager が失敗するため指定しない
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=debug key" >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon testSimulatorDebugUnitTest testEmpireDebugUnitTest
      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleSimulatorRelease assembleEmpireRelease
      - name: Collect
        run: |
          mkdir dist
          cp app/build/outputs/apk/simulator/release/app-simulator-release.apk "dist/EngineSimulator-${TAG}.apk"
          cp app/build/outputs/apk/empire/release/app-empire-release.apk "dist/EngineEmpire-${TAG}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cp docs/RELEASE_NOTES.md dist/notes.md
          printf '\n---\nSigned with: %s\n' "$SIGNED_WITH" >> dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: dist/notes.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
